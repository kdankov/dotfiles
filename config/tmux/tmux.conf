# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# 0 is too far from ` ;)
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g renumber-windows on       # renumber all windows when any window is closed
set -g status-position bottom    

# Stuff
set -g status-keys vi
set -g history-limit 20000
set -g display-time 4000         # (was from tmux-sensible) show messages for 4s
set -g focus-events on           # (was from tmux-sensible) let vim etc. see focus changes

# Window navigation (was from tmux-sensible)
bind-key a last-window
bind-key C-p previous-window
bind-key C-n next-window

setw -g mode-keys vi
setw -g monitor-activity on

set -g mouse on

# Colors
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# make scrolling with wheels work
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# split panes using | and -
bind | split-window -h
bind \\ split-window -h
bind - split-window -v
bind _ split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
bind R source-file ~/.tmux.conf \; display-message "Sourced ~/.tmux.conf"

bind-key v split-window -h
bind-key s split-window -v

bind-key J resize-pane -D 15
bind-key K resize-pane -U 15
bind-key H resize-pane -L 15
bind-key L resize-pane -R 15

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Send keys to the terminals
set-window-option -g xterm-keys on

# Auto-rename windows to the running process; manual renames (prefix+,) are preserved per-window
# Claude Code's binary lives at versions/<x.y.z>, and tmux names the window after the
# executable's basename, so rewrite bare version numbers back to "claude".
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{s|^[0-9]+\.[0-9]+\.[0-9]+.*$|claude|:pane_current_command}'
set-option -g allow-rename off
set-option -g set-titles off

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# disable close window/pane confirmations
bind-key & kill-window
bind-key x kill-pane
bind-key Q kill-session

# THEME
set -g status-interval 15

# ------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'macchiato'   # latte, frappe, macchiato, mocha
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #{b:window_name}'
set -g @catppuccin_window_current_text ' #{b:window_name}'

# Load catppuccin now (v2 is plain tmux config, so this is fast) so the
# status line below can use its modules
run ~/.tmux/plugins/tmux/catppuccin.tmux
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_session}'

set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'

# Save/restore sessions across server restarts (prefix+C-s save, prefix+C-r restore).
# continuum autosaves every 15 min and restores on server start; it hooks into
# status-right, so keep it the last plugin.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

bind -T copy-mode    C-c send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "pbcopy"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
